provider: openrouter
base_url: https://openrouter.ai/api/v1/chat/completions
# Pin a cheap JSON-capable model; change only with a new evaluation series.
model: openai/gpt-4o-mini
temperature: 0
max_tokens: 800
allow_fallbacks: false
require_parameters: true
# Optional: pin a single provider slug, e.g. ["openai"]
provider_order: []

rubric_version: plant_care_v1
score_dims:
  - factual_correctness
  - context_fit
  - practicality
  - calibrated_uncertainty
score_range: [0, 2]
total_range: [0, 8]

cache_dir: reports/metrics/judge_cache
results_dir: reports/metrics/judge
